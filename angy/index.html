<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AURA app — Cerebro Digital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AURA">
  <meta name="theme-color" content="#0A0F1D">
  <link rel="apple-touch-icon" href="./aura-apple-touch.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="./aura-192.png?v=3">
  <link rel="icon" type="image/png" sizes="512x512" href="./aura-512.png?v=3">
  <link rel="manifest" href="./angy/manifest.json?v=3">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A0F1D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loader {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0A0F1D;
      color: #F8FAFC;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(34, 211, 238, 0.2);
      border-top-color: #22D3EE;
      border-radius: 50%;
      animation: spin 0.9s infinite linear;
      margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .badge {
      background: #22D3EE;
      color: #0A0F1D;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    h2 { font-size: 20px; margin-bottom: 8px; font-weight: 600; color: #F8FAFC; }
    p { color: #94A3B8; font-size: 14px; max-width: 300px; text-align: center; line-height: 1.4; }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    a.btn {
      margin-top: 20px;
      display: inline-block;
      background: #22D3EE;
      color: #0A0F1D;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="badge">AURA COMPANION</div>
    <div class="spinner"></div>
    <h2>Conectando con AURA...</h2>
    <p>Enrutando de forma segura con tu Cerebro Digital.</p>
    <div id="fallback" style="display:none;">
      <a id="directLink" class="btn" href="#">Entrar directamente</a>
    </div>
  </div>

  <iframe id="appFrame" src="about:blank" allow="clipboard-read; clipboard-write; microphone; camera; fullscreen"></iframe>

  <script>
    const fallbackUrl = "https://telecom-participated-sally-lay.trycloudflare.com";
    const iframe = document.getElementById("appFrame");
    const loader = document.getElementById("loader");

    async function loadApp() {
      let targetUrl = fallbackUrl;
      try {
        const res = await fetch("./angy/endpoint.json?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (data && data.active_tunnel) {
            targetUrl = data.active_tunnel;
          }
        }
      } catch (e) {
        console.warn("Fallback tunnel url:", e);
      }

      iframe.src = targetUrl;
      iframe.onload = () => {
        loader.style.opacity = "0";
        setTimeout(() => { loader.style.display = "none"; }, 300);
      };

      setTimeout(() => {
        const fb = document.getElementById("fallback");
        const dl = document.getElementById("directLink");
        if (fb && dl) {
          dl.href = targetUrl;
          fb.style.display = "block";
        }
      }, 5000);
    }

    loadApp();
  </script>
</body>
</html>
